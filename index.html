<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>SURAJ AI - Admin Panel</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: #1a1a2e;
            color: #fff;
            overflow-x: hidden;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
            background: rgba(26, 26, 46, 0.98);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid #00d4ff;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            transform: translateY(-100%);
            animation: slideDown 0.8s ease forwards;
        }

        @media (min-width: 768px) {
            .navbar {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                padding: 15px 30px;
            }
        }

        @keyframes slideDown {
            to { transform: translateY(0); }
        }

        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .logo-section {
                flex-direction: row;
                width: auto;
            }
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .logo i {
            font-size: 2rem;
            color: #00d4ff;
            filter: drop-shadow(0 0 10px #00d4ff);
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { filter: drop-shadow(0 0 10px #00d4ff); }
            50% { filter: drop-shadow(0 0 20px #00d4ff); }
        }

        .logo h1 {
            font-size: 1.2rem;
            font-weight: 700;
            background: linear-gradient(45deg, #fff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .social-media {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        @media (min-width: 768px) {
            .social-media {
                width: auto;
                margin-left: 20px;
            }
        }

        .social-icon {
            width: 35px;
            height: 35px;
            border: 2px solid #00d4ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            font-size: 0.9rem;
        }

        .social-icon::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: #00d4ff;
            transition: 0.3s;
            z-index: -1;
        }

        .social-icon:hover::before {
            left: 0;
        }

        .social-icon:hover {
            color: #1a1a2e;
            transform: translateY(-5px);
            box-shadow: 0 0 20px #00d4ff;
        }

        .nav-links {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex-wrap: wrap;
        }

        @media (min-width: 768px) {
            .nav-links {
                width: auto;
                gap: 20px;
            }
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            position: relative;
            padding: 5px 0;
            transition: 0.3s;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .nav-links a::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: #00d4ff;
            transition: 0.3s;
            box-shadow: 0 0 10px #00d4ff;
        }

        .nav-links a:hover::before {
            width: 100%;
        }

        .nav-links a:hover {
            color: #00d4ff;
        }

        .nav-links .premium-btn {
            border: 2px solid #00d4ff;
            padding: 6px 15px;
            border-radius: 40px;
            background: transparent;
            transition: 0.3s;
        }

        .nav-links .premium-btn:hover {
            background: #00d4ff;
            color: #1a1a2e;
            box-shadow: 0 0 20px #00d4ff;
        }

        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            color: #00d4ff;
            cursor: pointer;
        }

        .main-container {
            margin-top: 180px;
            padding: 15px;
        }

        @media (min-width: 768px) {
            .main-container {
                margin-top: 120px;
                padding: 20px 30px;
            }
        }

        .access-message {
            text-align: center;
            padding: 60px 15px;
            background: rgba(255,255,255,0.05);
            border: 2px solid #00d4ff;
            border-radius: 15px;
            margin: 30px auto;
            max-width: 500px;
        }

        .access-message i {
            font-size: 3rem;
            color: #00d4ff;
            margin-bottom: 15px;
        }

        .access-message h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .access-message p {
            color: #6c6c8a;
            margin-bottom: 20px;
        }

        .access-message input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.1);
            border: 2px solid #00d4ff;
            border-radius: 10px;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .access-message input:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .access-btn {
            padding: 12px 40px;
            border: 2px solid #00d4ff;
            border-radius: 30px;
            background: #00d4ff;
            color: #1a1a2e;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .access-btn:hover {
            background: transparent;
            color: #fff;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }

        .admin-panel {
            background: rgba(255,255,255,0.05);
            border: 2px solid #00d4ff;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        @media (min-width: 768px) {
            .admin-panel {
                padding: 30px;
            }
        }

        .admin-header {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (min-width: 768px) {
            .admin-header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .admin-header h2 {
            font-size: 1.5rem;
            background: linear-gradient(45deg, #fff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .admin-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .admin-tab {
            padding: 8px 15px;
            border: 2px solid #00d4ff;
            border-radius: 30px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .admin-tab.active {
            background: #00d4ff;
            color: #1a1a2e;
        }

        .admin-tab:hover {
            background: #00d4ff;
            color: #1a1a2e;
        }

        .admin-form {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (min-width: 640px) {
            .admin-form {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .admin-input-group {
            position: relative;
        }

        .admin-input-group input,
        .admin-input-group select,
        .admin-input-group textarea {
            width: 100%;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border: 2px solid #00d4ff;
            border-radius: 10px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .admin-input-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .admin-input-group label {
            color: #00d4ff;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-input-group label input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .admin-btn {
            padding: 10px 20px;
            border: 2px solid #00d4ff;
            border-radius: 30px;
            background: transparent;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-size: 14px;
            width: 100%;
        }

        @media (min-width: 768px) {
            .admin-btn {
                padding: 12px 30px;
                font-size: 16px;
                width: auto;
            }
        }

        .admin-btn:hover {
            background: #00d4ff;
            color: #1a1a2e;
            box-shadow: 0 0 20px #00d4ff;
        }

        .admin-btn.delete {
            border-color: #ff4444;
        }

        .admin-btn.delete:hover {
            background: #ff4444;
            color: #fff;
        }

        .admin-list {
            margin-top: 20px;
        }

        .admin-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid #00d4ff;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        @media (min-width: 640px) {
            .admin-item {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .admin-item-info h4 {
            color: #00d4ff;
            margin-bottom: 5px;
            font-size: 1rem;
        }

        .admin-item-info p {
            color: rgba(255,255,255,0.7);
            font-size: 12px;
        }

        .admin-item-info .stock-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 15px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 3px;
        }

        .admin-item-info .stock-badge.in-stock {
            background: rgba(40, 167, 69, 0.3);
            color: #28a745;
            border: 1px solid #28a745;
        }

        .admin-item-info .stock-badge.out-of-stock {
            background: rgba(220, 53, 69, 0.3);
            color: #dc3545;
            border: 1px solid #dc3545;
        }

        .admin-item-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .admin-item-actions button {
            padding: 5px 12px;
            border: 1px solid #00d4ff;
            border-radius: 20px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
            font-size: 12px;
        }

        .admin-item-actions button.edit:hover {
            background: #00d4ff;
            color: #1a1a2e;
        }

        .admin-item-actions button.delete:hover {
            background: #ff4444;
            border-color: #ff4444;
        }

        .hidden {
            display: none !important;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 25px;
            background: rgba(26, 26, 46, 0.95);
            border: 2px solid #00d4ff;
            border-radius: 10px;
            color: #fff;
            z-index: 9999;
            display: none;
            animation: slideUp 0.5s ease;
            backdrop-filter: blur(10px);
        }

        .toast.show {
            display: block;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .loader {
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 30px 0;
        }

        .loader-circle {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00d4ff;
            animation: loader 1s ease-in-out infinite;
        }

        .loader-circle:nth-child(2) { animation-delay: 0.2s; }
        .loader-circle:nth-child(3) { animation-delay: 0.4s; }

        @keyframes loader {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.5); opacity: 1; }
        }

        .back-to-top {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #00d4ff, #00a8cc);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a2e;
            text-decoration: none;
            font-size: 1.2rem;
            box-shadow: 0 0 30px #00d4ff;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            z-index: 998;
            border: none;
            cursor: pointer;
        }

        .back-to-top.show {
            opacity: 1;
            visibility: visible;
        }

        .back-to-top:hover {
            transform: translateY(-5px);
        }

        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }
            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                padding: 20px 0;
            }
            .nav-links.active {
                display: flex;
            }
            .admin-form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <!-- ===== NAVBAR ===== -->
    <nav class="navbar">
        <div class="logo-section">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
                <div>
                    <h1>SURAJ AI</h1>
                    <span style="font-size: 0.7rem; color: #00d4ff;">Admin Panel</span>
                </div>
            </div>
            
            <div class="social-media">
                <a href="https://www.instagram.com/backlock_2024?igsh=MWMzc29leG45dmJqbQ==" class="social-icon" title="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://www.facebook.com/profile.php?id=61579322197572&mibextid=ZbWKwL" class="social-icon" title="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="https://t.me/animesupperworld" class="social-icon" title="Telegram">
                    <i class="fab fa-telegram-plane"></i>
                </a>
                <a href="https://x.com/solutionenjo127" class="social-icon" title="Twitter">
                    <i class="fab fa-twitter"></i>
                </a>
                <a href="https://pin.it/1LF1j46WC" class="social-icon" title="Pinterest">
                    <i class="fab fa-pinterest"></i>
                </a>
                <a href="https://youtube.com" class="social-icon" title="YouTube">
                    <i class="fab fa-youtube"></i>
                </a>
                <a href="https://surajlabai.github.io/suraj" class="social-icon" title="Portfolio">
                    <i class="fas fa-briefcase"></i>
                </a>
            </div>
        </div>
        
        <div class="nav-links" id="navLinks">
            <a onclick="logout()" class="premium-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>

        <div class="menu-toggle" onclick="toggleMenu()">
            <i class="fas fa-bars"></i>
        </div>
    </nav>

    <!-- ===== MAIN CONTAINER ===== -->
    <div class="main-container">

        <!-- ===== ACCESS MESSAGE ===== -->
        <div id="adminAccess" class="access-message">
            <i class="fas fa-lock"></i>
            <h2>Admin Access Required</h2>
            <p>Enter admin password to continue</p>
            <input type="password" id="adminPassword" placeholder="Enter Password" />
            <button class="access-btn" onclick="verifyAdmin()">Unlock Admin Panel</button>
        </div>

        <!-- ===== ADMIN PANEL ===== -->
        <div id="adminPanel" class="hidden">
            <div class="admin-panel">
                <div class="admin-header">
                    <h2><i class="fas fa-box"></i> Product Management</h2>
                    <div class="admin-tabs">
                        <button class="admin-tab active" onclick="switchTab('add')">➕ Add Product</button>
                        <button class="admin-tab" onclick="switchTab('list')">📋 All Products</button>
                    </div>
                </div>

                <!-- Add Product Form -->
                <div id="addProductTab">
                    <div class="admin-form">
                        <div class="admin-input-group">
                            <input type="text" id="productName" placeholder="Product Name *" />
                        </div>
                        <div class="admin-input-group">
                            <select id="productCategory">
                                <option value="skin care">skin care</option>
                                <option value="Hair care">Hair care</option>
                                <option value="Home & Living">Home & Living</option>
                                <option value="Beauty">Beauty</option>
                                <option value="Books">Books</option>
                                <option value="General">General</option>
                            </select>
                        </div>
                        <div class="admin-input-group">
                            <input type="number" id="productPrice" placeholder="Price (₹) *" />
                        </div>
                        <div class="admin-input-group">
                            <input type="number" id="productStock" placeholder="Stock Quantity *" />
                        </div>
                        <div class="admin-input-group">
                            <input type="text" id="productImage" placeholder="Image URL (optional)" />
                        </div>
                        <div class="admin-input-group">
                            <textarea id="productDescription" placeholder="Product Description"></textarea>
                        </div>
                        <div class="admin-input-group">
                            <label>
                                <input type="checkbox" id="productIsNew" /> Mark as New Arrival
                            </label>
                        </div>
                        <div class="admin-input-group">
                            <button class="admin-btn" onclick="addProduct()">
                                <i class="fas fa-save"></i> Add Product
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Product List -->
                <div id="listProductTab" class="hidden">
                    <div class="admin-list" id="productList">
                        <div class="loader">
                            <div class="loader-circle"></div>
                            <div class="loader-circle"></div>
                            <div class="loader-circle"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== BACK TO TOP ===== -->
    <button class="back-to-top" id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script>
        // ============================================
        // FIREBASE CONFIG
        // ============================================
        const firebaseConfig = {
            apiKey: "AIzaSyBWboop2NtbdfGyjfAYabWXM09V9U3xVdo",
            authDomain: "online-shopping-c3081.firebaseapp.com",
            databaseURL: "https://online-shopping-c3081-default-rtdb.firebaseio.com",
            projectId: "online-shopping-c3081",
            storageBucket: "online-shopping-c3081.firebasestorage.app",
            messagingSenderId: "652206097848",
            appId: "1:652206097848:web:36433c60a35f1df296bb4d",
            measurementId: "G-DCXE824N0C"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        console.log("✅ Firebase Connected!");

        // ============================================
        // ADMIN AUTH
        // ============================================
        let adminAuthenticated = false;
        let editingProductId = null;

        function verifyAdmin() {
            const password = document.getElementById('adminPassword').value;
            if (password === 'suraj@127') {
                adminAuthenticated = true;
                document.getElementById('adminAccess').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                showToast('✅ Admin login successful!');
                loadProducts();
            } else {
                showToast('❌ Incorrect password!');
            }
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                adminAuthenticated = false;
                document.getElementById('adminAccess').classList.remove('hidden');
                document.getElementById('adminPanel').classList.add('hidden');
                document.getElementById('adminPassword').value = '';
                showToast('Logged out');
            }
        }

        // ============================================
        // TAB SWITCH
        // ============================================
        function switchTab(tab) {
            const tabs = document.querySelectorAll('.admin-tab');
            tabs.forEach(t => t.classList.remove('active'));
            
            if (tab === 'add') {
                document.getElementById('addProductTab').classList.remove('hidden');
                document.getElementById('listProductTab').classList.add('hidden');
                tabs[0].classList.add('active');
                editingProductId = null;
                clearForm();
            } else {
                document.getElementById('addProductTab').classList.add('hidden');
                document.getElementById('listProductTab').classList.remove('hidden');
                tabs[1].classList.add('active');
                loadProducts();
            }
        }

        function clearForm() {
            document.getElementById('productName').value = '';
            document.getElementById('productCategory').value = 'skin care';
            document.getElementById('productPrice').value = '';
            document.getElementById('productStock').value = '';
            document.getElementById('productImage').value = '';
            document.getElementById('productDescription').value = '';
            document.getElementById('productIsNew').checked = false;
        }

        // ============================================
        // ADD PRODUCT
        // ============================================
        function addProduct() {
            const name = document.getElementById('productName').value.trim();
            const category = document.getElementById('productCategory').value;
            const price = document.getElementById('productPrice').value;
            const stock = document.getElementById('productStock').value;
            const image = document.getElementById('productImage').value.trim() || 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&q=80';
            const description = document.getElementById('productDescription').value.trim();
            const isNew = document.getElementById('productIsNew').checked;

            if (!name || !price || !stock) {
                showToast('⚠️ Please fill Name, Price and Stock fields');
                return;
            }

            const productData = {
                name: name,
                category: category,
                price: parseFloat(price),
                stock: parseInt(stock),
                image: image,
                description: description,
                isNew: isNew,
                createdAt: new Date().toISOString()
            };

            if (editingProductId) {
                db.ref('products/' + editingProductId).update(productData).then(() => {
                    showToast('✅ Product updated successfully! 🎉');
                    editingProductId = null;
                    clearForm();
                    loadProducts();
                }).catch(error => {
                    showToast('❌ Error: ' + error.message);
                });
            } else {
                db.ref('products').push(productData).then(() => {
                    showToast('✅ Product added successfully! 🎉');
                    clearForm();
                    loadProducts();
                }).catch(error => {
                    showToast('❌ Error: ' + error.message);
                });
            }
        }

        // ============================================
        // LOAD PRODUCTS
        // ============================================
        function loadProducts() {
            const container = document.getElementById('productList');
            container.innerHTML = `
                <div class="loader">
                    <div class="loader-circle"></div>
                    <div class="loader-circle"></div>
                    <div class="loader-circle"></div>
                </div>
            `;

            db.ref('products').on('value', (snapshot) => {
                const products = snapshot.val();
                container.innerHTML = '';
                
                if (!products) {
                    container.innerHTML = '<p style="text-align:center; color:#6c6c8a; padding:20px;">No products found</p>';
                    return;
                }

                Object.keys(products).forEach(key => {
                    const p = products[key];
                    const inStock = p.stock && p.stock > 0;
                    
                    const item = document.createElement('div');
                    item.className = 'admin-item';
                    item.innerHTML = `
                        <div class="admin-item-info">
                            <h4>${p.name} ${p.isNew ? '✨ NEW' : ''}</h4>
                            <p>${p.category || 'General'} | ₹${p.price}</p>
                            <p>${p.description || ''}</p>
                            <span class="stock-badge ${inStock ? 'in-stock' : 'out-of-stock'}">
                                ${inStock ? '✅ In Stock (' + p.stock + ')' : '❌ Out of Stock'}
                            </span>
                        </div>
                        <div class="admin-item-actions">
                            <button class="edit" onclick="editProduct('${key}')">
                                <i class="fas fa-edit"></i> Edit
                            </button>
                            <button class="delete" onclick="deleteProduct('${key}')">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>
                    `;
                    container.appendChild(item);
                });
            });
        }

        // ============================================
        // EDIT PRODUCT
        // ============================================
        function editProduct(id) {
            editingProductId = id;
            switchTab('add');
            
            db.ref('products/' + id).once('value', (snapshot) => {
                const p = snapshot.val();
                if (p) {
                    document.getElementById('productName').value = p.name || '';
                    document.getElementById('productCategory').value = p.category || 'skin care';
                    document.getElementById('productPrice').value = p.price || '';
                    document.getElementById('productStock').value = p.stock || '';
                    document.getElementById('productImage').value = p.image || '';
                    document.getElementById('productDescription').value = p.description || '';
                    document.getElementById('productIsNew').checked = p.isNew || false;
                    document.querySelector('.admin-tabs')[0].textContent = '✏️ Edit Product';
                }
            });
        }

        // ============================================
        // DELETE PRODUCT
        // ============================================
        function deleteProduct(id) {
            if (confirm('Are you sure you want to delete this product?')) {
                db.ref('products/' + id).remove().then(() => {
                    showToast('✅ Product deleted successfully');
                }).catch(error => {
                    showToast('❌ Error: ' + error.message);
                });
            }
        }

        // ============================================
        // TOAST
        // ============================================
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        // ============================================
        // MENU TOGGLE
        // ============================================
        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('active');
        }

        // ============================================
        // BACK TO TOP
        // ============================================
        window.addEventListener('scroll', () => {
            const btn = document.getElementById('backToTop');
            if (window.scrollY > 500) {
                btn.classList.add('show');
            } else {
                btn.classList.remove('show');
            }
        });

        // ============================================
        // INIT
        // ============================================
        if (adminAuthenticated) {
            document.getElementById('adminAccess').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            loadProducts();
        }
    </script>
</body>
</html>
